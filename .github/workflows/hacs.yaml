---
name: hacs

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'pranavmishra90' }}
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: "integration"
  