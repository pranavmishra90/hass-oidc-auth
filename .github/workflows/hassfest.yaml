---
name: hassfest

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'pranavmishra90' }}
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master